# Optional: two local Postgres servers for testing comparisons.
# Requires Docker Desktop. Seeds run automatically on first start.
services:
  driftly-dev:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: driftly_dev }
    ports: ["5433:5432"]
    volumes: ["./dev-databases/reference.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
  driftly-prod:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: driftly_prod }
    ports: ["5434:5432"]
    volumes: ["./dev-databases/target.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
